name: forgeflow

services:
  agent-server:
    image: ${OPENHANDS_SOURCE_IMAGE:-forgeflow-openhands-agent-server:1.39.1-source}
    container_name: forgeflow-openhands
    network_mode: host
    command: ["--host", "127.0.0.1", "--port", "18420"]
    env_file:
      - ${FORGEFLOW_OPENHANDS_ENV_FILE:-/etc/forgeflow/openhands.env}
    environment:
      OPENHANDS_SUPPRESS_BANNER: '1'
      LOG_JSON: 'true'
      OH_ENABLE_VNC: '0'
      OH_ENABLE_VSCODE: '0'
      OH_PRELOAD_TOOLS: '0'
      OPENCODE_CONFIG: /etc/forgeflow/opencode.json
      PYTHONPATH: /opt/forgeflow-tools
      FORGEFLOW_CONTROL_PLANE_URL: http://127.0.0.1:8420
      COREPACK_HOME: /openhands-state/corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      PATH: /openhands-state/toolchains/go-1.26.0/bin:/usr/local/bin:/usr/bin:/bin
      GOTOOLCHAIN: local
    volumes:
      - /var/lib/forgeflow/workspaces:/workspace
      - /var/lib/forgeflow/workspaces:/var/lib/forgeflow/workspaces
      - /var/lib/forgeflow/openhands:/openhands-state
      - ./opencode.json:/etc/forgeflow/opencode.json:ro
      - ./dsh-acp.patch.yml:/etc/forgeflow/dsh-acp.patch.yml:ro
      - ${FORGEFLOW_OPENHANDS_TOOLS_DIR:-../../openhands_tools}:/opt/forgeflow-tools:ro
      - /home/dev/projects/agent-harness:/opt/agent-harness:ro
    cap_drop: ["ALL"]
    security_opt:
      - seccomp:unconfined
      - apparmor:forgeflow-openhands-codex
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18420/docs', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
