# Declarative ForgeFlow project registry.
# Production copies belong outside Git, normally /etc/forgeflow/projects.yaml.
version: 1
projects:
  - projectKey: example
    displayName: Example Project
    description: Example only. Execution is disabled until explicitly enabled by an operator.
    repositoryPath: /home/dev/projects/example
    tags: [example]
    execution:
      enabled: false
      workspace: canonical-fast-forward
      allowProviderNative: false
      maxParallelWorkItems: 1
    improvement:
      enabled: false
