[project]
name = "forgeflow-policy"
version = "2.0.2"
description = "A thin software-engineering quality policy layer for Open SWE."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
  "agent-client-protocol==0.12.1",
  "open-swe-agent @ git+https://github.com/langchain-ai/open-swe.git@0ff86e22a94cc84e32883fcb1beee568560d4140",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeflow", "openswe_ext"]

[tool.uv]
override-dependencies = ["deepagents==0.7.13", "wcmatch>=11.0"]
constraint-dependencies = ["langgraph-api>=0.14,<0.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
